name: kmcp-connect-cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kmcp-install-ubuntu-usb
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.actor == 'siango' &&
      github.ref == 'refs/heads/feature/kmcp-portable-circuits-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Cloudflare registry integration
        working-directory: av15
        run: python3 -m unittest coding_worker_v2.tests.test_cloudflare_tools -v
      - name: Build exact-source offline host bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -m py_compile scripts/host/install-runtime.py
          python3 -m pip wheel --no-deps --wheel-dir host-bundle ./av15
          cp scripts/host/install-runtime.py host-bundle/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('host-bundle')
          files = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          (root/'release.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kmcp-offline-host-bundle-${{ github.sha }}
          path: host-bundle/
          retention-days: 14
  install:
    needs: release
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kmcp-offline-host-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/kmcp-offline-host-bundle
      - name: Install package and Cloudflare tools on the existing Ubuntu node
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/kmcp-offline-host-bundle/install-runtime.py" \
            --bundle "$RUNNER_TEMP/kmcp-offline-host-bundle" \
            --source-sha "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/kmcp-ubuntu-installation.json"
      - name: Verify installed adapter and bounded Workers AI inference
        env:
          SOURCE_SHA: ${{ github.sha }}
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from coding_worker_v2.agent.cloudflare_tools import CloudflareClient
          from coding_worker_v2.agent.tools import build_default_registry
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          home=Path.home()
          project=home/'kmcp-host-setup/cloudflare/kmcp-edge'
          def credential():
              p=subprocess.run([str(project/'node_modules/.bin/wrangler'),'auth','token','--json'],cwd=project,capture_output=True,text=True,timeout=45)
              if p.returncode: raise RuntimeError('NATIVE_CREDENTIAL_UNAVAILABLE')
              return json.loads(p.stdout)['token']
          inv=json.loads((home/'KnowingMind/state/installations/cloudflare-inventory.json').read_text())
          client=CloudflareClient(inv['account_id'],credential)
          models=client.inventory('ai_models')
          names=[x.get('name') for x in models['items']]
          preferred=('@cf/meta/llama-3.2-1b-instruct','@cf/meta/llama-3.1-8b-instruct','@cf/meta/llama-3-8b-instruct','@cf/mistral/mistral-7b-instruct-v0.1')
          selected=next((x for x in preferred if x in names),None)
          report={'schema':'KMCP_CLOUDFLARE_ADAPTER_ACCEPTANCE_V1','source_sha':os.environ['SOURCE_SHA'],'metadata':models,'http_cutover':False,'production_circuit':'NOT_RUN','resource_creation':False}
          if selected:
              client=CloudflareClient(inv['account_id'],credential,allowed_models=(selected,))
              try:
                  answer=client.infer(selected,'Reply only OK.',max_tokens=8)
                  report['inference']={'status':'PASS','model':selected,'response_present':bool(answer['response']),'billed_cost':None,'independent_qc':'NOT_RUN'}
              except Exception as e:
                  report['inference']={'status':'BLOCKED','reason':str(e)}
          else: report['inference']={'status':'BLOCKED_MODEL_DISCOVERY','discovered_names':names}
          registry=build_default_registry(circuits=True,cloudflare=client)
          report['adapter_import']='PASS'
          target=home/'KnowingMind/state/installations/cloudflare-adapter.json'
          target.write_text(json.dumps(report,indent=2)+'\n')
          out=Path(os.environ['RUNNER_TEMP'])/'kmcp-cloudflare-adapter.json'
          out.write_text(target.read_text())
          print(json.dumps(report,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcp-ubuntu-installation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kmcp-ubuntu-installation.json
            ${{ runner.temp }}/kmcp-cloudflare-adapter.json
          if-no-files-found: warn
          retention-days: 14
