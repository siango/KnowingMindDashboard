name: kmcp-install-on-ubuntu
on:
  push:
    branches: ['feature/kmcp-portable-circuits-20261122']
    paths:
      - 'av15/coding_worker_v2/agent/kmco_*.py'
      - 'av15/coding_worker_v2/agent/native_database.py'
      - 'av15/coding_worker_v2/tests/test_kmco_*.py'
      - '.github/workflows/kmcp-install-on-ubuntu.yml'
      - 'scripts/host/install-runtime.py'
      - 'scripts/host/accept-kmco-native.py'
      - 'scripts/host/accept-kmco-local-call.py'
      - 'scripts/host/qualify-kmco-with-codex.py'
      - 'scripts/host/karl-evidence-index.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kmcp-install-ubuntu-usb
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.actor == 'siango' &&
      github.ref == 'refs/heads/feature/kmcp-portable-circuits-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate complete source before runtime delivery
        working-directory: av15
        run: python3 -m unittest discover -s coding_worker_v2/tests -t . -q
      - name: Build exact-source offline host bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -m py_compile scripts/host/install-runtime.py
          python3 -m pip wheel --no-deps --wheel-dir host-bundle ./av15
          cp scripts/host/install-runtime.py scripts/host/accept-kmco-native.py scripts/host/accept-kmco-local-call.py scripts/host/qualify-kmco-with-codex.py scripts/host/karl-evidence-index.py host-bundle/
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('host-bundle')
          files = {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir() if p.is_file()}
          (root/'release.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kmcp-offline-host-bundle-${{ github.sha }}
          path: host-bundle/
          retention-days: 14
  install:
    needs: release
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kmcp-offline-host-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/kmcp-offline-host-bundle
      - name: Remove only prior run temporary acceptance reports
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ('kmcp-ubuntu-installation.json', 'kmco-installed-handler-readback.json',
                       'kmco-native-database-canary.json', 'kmco-local-tools-call.json',
                       'kmco-incremental-qualification.json'):
              (root/name).unlink(missing_ok=True)
          PY
      - name: Install package and Cloudflare tools on the existing Ubuntu node
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/kmcp-offline-host-bundle/install-runtime.py" \
            --bundle "$RUNNER_TEMP/kmcp-offline-host-bundle" \
            --source-sha "$SOURCE_SHA" --package-only \
            --receipt "$RUNNER_TEMP/kmcp-ubuntu-installation.json"
      - name: Read installed native handlers using the existing owner config
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = ubuntu-usb
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" -I - <<'PYCODE'
          import json, os
          from pathlib import Path
          from coding_worker_v2.agent.circuit_cli import load_runtime
          from coding_worker_v2.agent.kmco_route_audit import audit_routes
          cfg=Path.home()/'.config/knowingmind/kmcw-owner-runtime.json'
          ctx,registry=load_runtime(cfg)
          out=audit_routes(ctx['kmco_catalog'],registry,ctx)
          required={'P05':'kmco.p05.completion','P06':'kmco.p06.permission'}
          assert all(out['native_problem_circuit_handlers'].get(k)==v for k,v in required.items())
          assert out['native_operation_source_bound'] >= 30
          report={'schema':'KMCO_INSTALLED_SOURCE_ACCEPTANCE_V1',
                  'node':'ubuntu-usb','source_sha':os.environ['SOURCE_SHA'],
                  'native_source_bound':out['native_operation_source_bound'],
                  'remaining_design_only':out['design_only_operations'],
                  'verified_e2e_routes':out['verified_end_to_end_routes'],
                  'status':'INSTALLED_HANDLER_READBACK_ONLY',
                  'independent_qc':'NOT_RUN','production_acceptance':'NOT_GRANTED',
                  'registered_handlers':out['native_problem_circuit_handlers'],
                  'domain_handlers':out['native_domain_circuit_handlers']}
          p=Path(os.environ['RUNNER_TEMP'])/'kmco-installed-handler-readback.json'
          p.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report))
          PYCODE
      - name: Execute installed native database circuit through original owner authority
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" -I \
            "$RUNNER_TEMP/kmcp-offline-host-bundle/accept-kmco-native.py" \
            --receipt "$RUNNER_TEMP/kmco-native-database-canary.json"
      - name: Exercise real local KMCO tool calls without Codex dependency
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          KMCO_CONFIGURE_CODEX: '0'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" -I \
            "$RUNNER_TEMP/kmcp-offline-host-bundle/accept-kmco-local-call.py"
      - name: Qualify six local KMCO tools and optionally one bounded Codex turn
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          KMCO_CODEX_LIVE: '0' # Real runtime acceptance must not consume Codex quota
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" -I \
            "$RUNNER_TEMP/kmcp-offline-host-bundle/qualify-kmco-with-codex.py"
      - name: Index existing acceptance evidence once (no new runtime checks)
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if test -f "$RUNNER_TEMP/kmcp-offline-host-bundle/karl-evidence-index.py"; then
            python3 "$RUNNER_TEMP/kmcp-offline-host-bundle/karl-evidence-index.py" \
              --reports-dir "$RUNNER_TEMP" \
              --out "$RUNNER_TEMP/karl-evidence-index.json" \
              --source-sha "$SOURCE_SHA" \
              --run-id "$GITHUB_RUN_ID" --job-id "$GITHUB_JOB"
          else
            echo 'KARL_EVIDENCE_INDEX_SOURCE_MISSING'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcp-ubuntu-installation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kmcp-ubuntu-installation.json
            ${{ runner.temp }}/kmco-installed-handler-readback.json
            ${{ runner.temp }}/kmco-native-database-canary.json
            ${{ runner.temp }}/kmco-local-tools-call.json
            ${{ runner.temp }}/kmco-incremental-qualification.json
            ${{ runner.temp }}/karl-evidence-index.json
          if-no-files-found: warn
          retention-days: 14
