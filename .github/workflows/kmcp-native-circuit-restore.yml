name: kmcp-native-circuit-restore
on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/kmcp-native-circuit-restore.yml'
      - 'scripts/host/resume-native-circuit-recovery.py'
permissions:
  contents: read
jobs:
  read-native-state:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/kmcp-native-diagnostics-20261123' &&
      github.event.pull_request.user.login == 'siango'
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 30
    steps:
      - name: Run corrected existing owner circuit and private isolated restore acceptance
        env:
          EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import base64,hashlib,json,os,subprocess
          from pathlib import Path
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          graph=subprocess.run(['gh','api','repos/siango/KnowingMindDashboard/contents/scripts/host/accept-runtime-recovery.py?ref='+os.environ['EXPECTED_SOURCE']],capture_output=True,text=True,check=True)
          gd=json.loads(graph.stdout);gr=base64.b64decode(gd['content'])
          assert hashlib.sha1(b'blob '+str(len(gr)).encode()+b'\0'+gr).hexdigest()==gd['sha']
          (Path(os.environ['RUNNER_TEMP'])/'accept-runtime-recovery.py').write_bytes(gr)
          p=subprocess.run(['gh','api','repos/siango/KnowingMindDashboard/contents/scripts/host/resume-native-circuit-recovery.py?ref='+os.environ['EXPECTED_SOURCE']],capture_output=True,text=True,check=True)
          d=json.loads(p.stdout);raw=base64.b64decode(d['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==d['sha']
          script=Path(os.environ['RUNNER_TEMP'])/'resume-native-circuit-recovery.py';script.write_bytes(raw)
          subprocess.run([str(Path.home()/'KnowingMind/.venvs/kmcp-portable/bin/python'),str(script)],check=True,timeout=1500)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcp-native-circuit-restore-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/kmcp-native-circuit-restore.json
          if-no-files-found: warn
          retention-days: 14
