name: kmcp-existing-origin-binding
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/kmcp-existing-origin-binding.yml']
permissions:
  contents: read
jobs:
  binding:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/kmcp-portable-circuits-20261122' &&
      github.event.pull_request.user.login == 'siango'
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 3
    steps:
      - name: Read running origin metadata without exporting credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, os, subprocess
          from pathlib import Path
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          data={'schema':'KMCP_EXISTING_ORIGIN_BINDING_V1','service':'kmcp-v5.service','read_only':True}
          result=subprocess.run(['systemctl','show','kmcp-v5.service','--property=MainPID','--value'],
                                capture_output=True,text=True,check=True,timeout=10)
          pid=int(result.stdout.strip()); assert pid>0
          proc=Path('/proc')/str(pid)
          try:
              env=dict(x.split(b'=',1) for x in (proc/'environ').read_bytes().split(b'\0') if b'=' in x)
              data['path_bindings']={k:env.get(k.encode(),b'').decode(errors='replace') for k in
                  ('KEBUNATE_KMCW_BASE','KEBUNATE_KMCW_WORKSPACE','KMCO_CATALOG_ROOT')}
              cred=env.get(b'CREDENTIALS_DIRECTORY',b'').decode(errors='replace')
              data['admin_credential_channel_configured']=bool(cred)
              data['admin_credential_channel_readable']=bool(cred and os.access(cred,os.R_OK|os.X_OK))
          except OSError:
              data['credential_metadata']='UNREADABLE'
          args=(proc/'cmdline').read_bytes().split(b'\0')
          cwd=Path(os.readlink(proc/'cwd')); source=None
          for arg in args[1:]:
              text=arg.decode(errors='replace')
              if text.endswith('.py'):
                  source=Path(text) if Path(text).is_absolute() else cwd/text
                  break
          if source is None and b'-m' in args:
              source=cwd/(args[args.index(b'-m')+1].decode().replace('.','/')+'.py')
          if source is not None and source.is_file():
              body=source.read_bytes(); tree=ast.parse(body)
              data['source_path']=str(source)
              data['source_sha256']=hashlib.sha256(body).hexdigest()
              data['source_declared_tool_functions']=[n.name for n in ast.walk(tree)
                  if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))
                  and any(isinstance(d,ast.Call) and isinstance(d.func,ast.Attribute)
                          and d.func.attr=='tool' for d in n.decorator_list)]
          # Historical AV15 Access-pair delivery was a separate Dhamma identity.
          # Observe file metadata only: never read/copy or reuse its values as
          # KMCW Admin credentials or as a production origin bearer.
          import stat
          legacy=Path.home()/'.config/knowingmind/dhamma-mcp-access.env'
          try:
              meta=legacy.lstat()
              data['historical_dhamma_access_delivery']={
                  'present':True,
                  'owner_only_regular_file':(
                      stat.S_ISREG(meta.st_mode) and
                      meta.st_uid==os.geteuid() and
                      meta.st_mode & 0o077 == 0),
                  'values_read':False,
                  'authority_domain':'DHAMMA_ONLY'}
          except FileNotFoundError:
              data['historical_dhamma_access_delivery']={
                  'present':False,'values_read':False,
                  'authority_domain':'DHAMMA_ONLY'}
          # A systemd credentials directory is a DIFFERENT protected Admin
          # channel; its absence blocks per-tool delegation, not MCP transport.
          if cred:
              from pathlib import Path as _Path
              try:
                  admin=(_Path(cred)/'km-ai-admin.session-cookie').lstat()
                  data['admin_session_credential']={
                      'present':True,'private_regular_file':(
                          stat.S_ISREG(admin.st_mode) and
                          admin.st_uid in (0,os.geteuid()) and
                          admin.st_mode & 0o077 == 0),
                      'values_read':False}
              except OSError:
                  data['admin_session_credential']={
                      'present':False,'values_read':False}
          else:
              data['admin_session_credential']={
                  'present':False,'values_read':False}
          data['status']='METADATA_READBACK_ONLY'
          out=Path(os.environ['RUNNER_TEMP'])/'kmcp-existing-origin-binding.json'
          out.write_text(json.dumps(data,indent=2)+'\n')
          print(json.dumps(data,indent=2))
          PY
      - name: Qualify existing local HTTP surface and installed registry without secrets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from urllib import request, error
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          home=Path.home()
          report={'schema':'KMCP_HTTP_REGISTRY_READONLY_GATE_V1','mutation':False,'http_cutover':False,'execution_authority':'NOT_GRANTED_BY_THIS_JOB'}
          for url in ('http://127.0.0.1:18856/mcp','https://mcp.knowingmind.app/mcp'):
              try:
                  with request.urlopen(request.Request(url,headers={'Accept':'application/json, text/event-stream'}),timeout=8) as r:
                      status=r.status
              except error.HTTPError as e:
                  status=e.code
              except Exception as e:
                  status=type(e).__name__
              report['local_http' if url.startswith('http:') else 'external_http']={'status':status,'authenticated_tools_list':'NOT_TESTED'}
          installed=home/'KnowingMind/.venvs/kmcp-portable/bin/python'
          if installed.is_file():
              check=subprocess.run([str(installed),'-I','-c',
                'from coding_worker_v2.agent.tools import build_default_registry; print(len(build_default_registry(circuits=True).names()))'],
                text=True,capture_output=True,timeout=20)
              report['installed_base_registry']={'status':'PASS' if check.returncode==0 and check.stdout.strip().isdigit() else 'BLOCKED',
                  'count':int(check.stdout.strip()) if check.returncode==0 and check.stdout.strip().isdigit() else None}
          else:
              report['installed_base_registry']={'status':'NOT_FOUND'}
          report['acceptance']='BLOCKED_AUTHENTICATED_TOOL_LIST_AND_RUNTIME_BINDING'
          out=Path(os.environ['RUNNER_TEMP'])/'kmcp-http-registry-readonly-gate.json'
          out.write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kmcp-existing-origin-binding-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kmcp-existing-origin-binding.json
            ${{ runner.temp }}/kmcp-http-registry-readonly-gate.json
          retention-days: 14
