name: kmcp-platform-qualification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/kmcp-platform-qualification.yml']
permissions:
  contents: read
jobs:
  qualify:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/kmcp-portable-circuits-20261122' &&
      github.event.pull_request.user.login == 'siango'
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 5
    steps:
      - name: Qualify existing databases, catalog, Workers AI and Containers
        shell: bash
        env:
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python3 - <<'PY'
          import configparser, hashlib, json, os, shutil, subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from urllib import request,error,parse
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          home=Path.home(); project=home/'kmcp-host-setup/cloudflare/kmcp-edge'
          auth=subprocess.run([str(project/'node_modules/.bin/wrangler'),'auth','token','--json'],
                              cwd=project,capture_output=True,text=True,timeout=45)
          if auth.returncode: raise SystemExit('AUTH_UNAVAILABLE')
          creds=json.loads(auth.stdout)
          assert creds.get('type') in ('oauth','api_token')
          token=creds['token']
          inv=json.loads((home/'KnowingMind/state/installations/cloudflare-inventory.json').read_text())
          account=inv['account_id']
          data={'schema':'KMCP_PLATFORM_QUALIFICATION_V1','mission_id':'KMCP-V5-PRODUCTION',
                'observed_at':datetime.now(timezone.utc).isoformat(),'node_id':'ubuntu-usb',
                'resource_creation':False,'database_writes':False,'ai_canary_max_output_tokens':8}
          def api(path,body=None):
              req=request.Request('https://api.cloudflare.com/client/v4/accounts/'+account+'/'+path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
              try:
                  with request.urlopen(req,timeout=30) as r:
                      doc=json.load(r)
                      return {'status':r.status,'success':doc.get('success',True),'result':doc.get('result')}
              except error.HTTPError as e:
                  return {'status':e.code,'success':False}
              except (OSError,ValueError):
                  return {'status':'TRANSPORT_ERROR','success':False}
          models=api('ai/models/search?per_page=100')
          rows=models.get('result') if isinstance(models.get('result'),list) else []
          names=[x.get('name') for x in rows if isinstance(x,dict)]
          data['workers_ai_models']={'status':models['status'],'observed_count':len(rows),
                                    'small_canary_model_discovered':'@cf/meta/llama-3.2-1b-instruct' in names}
          if '@cf/meta/llama-3.2-1b-instruct' in names:
              result=api('ai/run/@cf/meta/llama-3.2-1b-instruct',
                         {'messages':[{'role':'user','content':'Reply only OK.'}],'max_tokens':8,'temperature':0})
              output=result.get('result')
              data['workers_ai_canary']={'status':result['status'],'success':result['success'],
                  'model':'@cf/meta/llama-3.2-1b-instruct',
                  'response_present':isinstance(output,dict) and bool(output.get('response')),
                  'result_sha256':hashlib.sha256(json.dumps(output,sort_keys=True).encode()).hexdigest() if output is not None else None,
                  'billed_cost':'UNKNOWN','independent_qc':'NOT_RUN'}
          else:
              data['workers_ai_canary']={'status':'BLOCKED_MODEL_DISCOVERY'}
          containers=api('containers/applications')
          apps=containers.get('result')
          if isinstance(apps,dict): apps=apps.get('applications',[])
          data['containers']={'status':containers['status'],
              'applications':[{'id':x.get('id'),'name':x.get('name')} for x in apps if isinstance(x,dict)] if isinstance(apps,list) else None,
              'deployed_by_this_job':False,'docker_available':bool(shutil.which('docker'))}
          d1=next((x for x in inv['resources']['d1']['items'] if x['name']=='kebunate-control-runtime'),None)
          if d1:
              result=api('d1/database/'+d1['uuid']+'/query',
                         {'sql':"SELECT name,type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name LIMIT 100;"})
              result_rows=[]
              for statement in result.get('result') or []:
                  result_rows.extend(statement.get('results',[]))
              data['existing_d1_schema']={'database':'kebunate-control-runtime','status':result['status'],
                                          'tables':result_rows,'limit':100,'writes':False}
          data['commands']={x:shutil.which(x) for x in ('kmcp','km','kmnw','kves','psql','docker')}
          roots=[home/'KnowingMind/workspaces/microops-source',home/'KnowingMind/workspaces/kmco-github-qc']
          catalog=[]
          queues=[]
          for root in roots:
              if not root.is_dir(): continue
              for pattern in ('kmco-registry-candidate.json','*/kmco-registry-candidate.json','*/*/kmco-registry-candidate.json'):
                  for path in root.glob(pattern):
                      catalog.append({'path':str(path),'core_md':(path.parent/'core.md').is_file(),'domain_md':(path.parent/'domain.md').is_file()})
              for path in (root/'queue',root/'state/queue',root/'av15/state/queue',root/'av15/state/coding-worker/queue'):
                  if path.is_dir():
                      queues.append({'path':str(path),'inbox':(path/'inbox').is_dir(),'doing':(path/'doing').is_dir(),'index':(path/'index').is_dir()})
          data['catalog_candidates']=catalog
          data['queue_candidates']=queues
          service_file=home/'.pg_service.conf'
          services=[]
          if service_file.is_file():
              cfg=configparser.ConfigParser(interpolation=None); cfg.read(service_file)
              services=[s for s in cfg.sections() if cfg[s].get('dbname')=='km_microops'
                        and cfg[s].get('host','/var/run/postgresql') in ('/var/run/postgresql','localhost','127.0.0.1')]
          data['kmco_pg_service_candidates']=services
          if shutil.which('psql'):
              dbarg='service='+services[0] if len(services)==1 else 'dbname=km_microops connect_timeout=3'
              sql="BEGIN READ ONLY; SET LOCAL statement_timeout='3000ms'; SELECT json_build_object('database',current_database(),'role',current_user,'extensions',(SELECT json_agg(extname) FROM pg_extension),'tables',(SELECT json_agg(table_schema||'.'||table_name) FROM information_schema.tables WHERE table_schema NOT IN ('pg_catalog','information_schema'))); COMMIT;"
              p=subprocess.run(['psql','-X','-w','-At','-d',dbarg,'-c',sql],capture_output=True,text=True,timeout=15)
              if p.returncode==0:
                  values=[json.loads(x) for x in p.stdout.splitlines() if x.startswith('{')]
                  data['postgres_readback']={'status':'PASS','metadata':values}
              else:
                  data['postgres_readback']={'status':'CONNECTION_OR_SCOPE_BLOCKED','returncode':p.returncode}
          token=None; creds=None
          data['status']='QUALIFICATION_WITH_EXPLICIT_PER_COMPONENT_OUTCOMES'
          out=Path(os.environ['RUNNER_TEMP'])/'kmcp-platform-qualification.json'
          out.write_text(json.dumps(data,indent=2)+'\n')
          target=home/'KnowingMind/state/installations/platform-qualification.json'
          target.parent.mkdir(parents=True,exist_ok=True); target.write_text(out.read_text())
          print(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcp-platform-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/kmcp-platform-qualification.json
          if-no-files-found: warn
          retention-days: 14
