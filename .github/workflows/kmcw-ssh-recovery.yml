name: kmcw-ssh-recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kmcp-install-ubuntu-usb
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.ref == 'refs/heads/feature/kmcp-portable-circuits-20261122' &&
      github.actor == 'siango'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full source before delivery
        working-directory: av15
        run: python3 -m unittest discover -s coding_worker_v2/tests -q
      - name: Build exact-source offline application and database-driver bundle
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 -m py_compile scripts/host/accept-runtime-recovery.py
          python3 -m pip wheel --no-deps --wheel-dir host-bundle ./av15
          python3 -m pip download --only-binary=:all: --dest host-bundle/dependencies 'psycopg[binary]>=3.2,<4'
          cp scripts/host/install-runtime.py scripts/host/accept-runtime-recovery.py host-bundle/
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path('host-bundle')
          files={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          (root/'release.json').write_text(json.dumps({'source_sha':os.environ['SOURCE_SHA'],'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kmcw-ssh-offline-${{ github.sha }}
          path: host-bundle/
          retention-days: 14
  install-and-accept:
    needs: release
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kmcw-ssh-offline-${{ github.sha }}
          path: ${{ runner.temp }}/kmcw-ssh-offline
      - name: Install verified package on existing node
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 "$RUNNER_TEMP/kmcw-ssh-offline/install-runtime.py" \
            --bundle "$RUNNER_TEMP/kmcw-ssh-offline" --source-sha "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/kmcw-ssh-installation.json"
      - name: Accept native conversation, scoped circuit, real database and private recovery
        env:
          SOURCE_SHA: ${{ github.sha }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ionice -c3 nice -n10 "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" -I \
            "$RUNNER_TEMP/kmcw-ssh-offline/accept-runtime-recovery.py" \
            --bundle "$RUNNER_TEMP/kmcw-ssh-offline" --source-sha "$SOURCE_SHA" \
            --receipt "$RUNNER_TEMP/kmcw-native-recovery.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcw-native-recovery-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/kmcw-ssh-installation.json
            ${{ runner.temp }}/kmcw-native-recovery.json
          if-no-files-found: warn
          retention-days: 14

