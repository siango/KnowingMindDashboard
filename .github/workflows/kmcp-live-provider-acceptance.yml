name: kmcp-live-provider-acceptance
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/kmcp-live-provider-acceptance.yml']
permissions:
  contents: read
jobs:
  accept:
    if: >-
      github.repository == 'siango/KnowingMindDashboard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/kmcp-portable-circuits-20261122' &&
      github.event.pull_request.user.login == 'siango'
    runs-on: [self-hosted, Linux, X64, kmcp, nonprod]
    timeout-minutes: 5
    steps:
      - name: Qualify installed Cloudflare adapter with existing KMCO catalog
        env:
          SOURCE_SHA: '45412e5dfcfa64424c940ed4f068c27ffe720430'
          WRANGLER_SEND_METRICS: 'false'
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          cd "$RUNNER_TEMP"
          "$HOME/KnowingMind/.venvs/kmcp-portable/bin/python" - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from coding_worker_v2.agent.cloudflare_tools import CloudflareClient
          from coding_worker_v2.agent.tools import build_default_registry
          assert os.environ['RUNNER_NAME']=='ubuntu-usb'
          home=Path.home()
          project=home/'kmcp-host-setup/cloudflare/kmcp-edge'
          def credential():
              p=subprocess.run([str(project/'node_modules/.bin/wrangler'),'auth','token','--json'],cwd=project,capture_output=True,text=True,timeout=45)
              if p.returncode: raise RuntimeError('NATIVE_CREDENTIAL_UNAVAILABLE')
              return json.loads(p.stdout)['token']
          inv=json.loads((home/'KnowingMind/state/installations/cloudflare-inventory.json').read_text())
          client=CloudflareClient(inv['account_id'],credential)
          models=client.inventory('ai_models')
          names=[x.get('name') for x in models['items']]
          preferred=('@cf/ibm-granite/granite-4.0-h-micro','@cf/meta/llama-3.2-1b-instruct','@cf/meta/llama-3.1-8b-instruct','@cf/meta/llama-3-8b-instruct','@cf/mistral/mistral-7b-instruct-v0.1')
          selected=next((x for x in preferred if x in names),None)
          from coding_worker_v2.agent.kmco_runtime import KMCOCatalog
          catalog=KMCOCatalog.from_snapshot(home/'KnowingMind/workspaces/microops-source')
          report={'schema':'KMCP_CLOUDFLARE_ADAPTER_ACCEPTANCE_V1','source_sha':os.environ['SOURCE_SHA'],'metadata':models,'http_cutover':False,'production_circuit':'NOT_RUN','resource_creation':False}
          if selected:
              client=CloudflareClient(inv['account_id'],credential,allowed_models=(selected,))
              try:
                  wire=client._call('ai/run/'+selected,{'messages':[{'role':'user','content':'Reply only OK.'}],'max_tokens':8,'temperature':0})
                  payload=wire.get('result')
                  report['provider_result_shape']={k:type(v).__name__ for k,v in payload.items()} if isinstance(payload,dict) else type(payload).__name__
                  if isinstance(payload,dict) and isinstance(payload.get('choices'),list):
                      report['choice_shapes']=[{k:type(v).__name__ for k,v in x.items()} for x in payload['choices'][:1] if isinstance(x,dict)]
                  report['inference']={'status':'PROVIDER_RESPONSE_RECEIVED','model':selected,'adapter_acceptance':'BLOCKED_SCHEMA','independent_qc':'NOT_RUN'}
                  answer={'response':''}
                  report['inference']['provider_success']=True
              except Exception as e:
                  report['inference']={'status':'BLOCKED','reason':str(e)}
          else: report['inference']={'status':'BLOCKED_MODEL_DISCOVERY','discovered_names':names}
          registry=build_default_registry(circuits=True,cloudflare=client,kmco_catalog=catalog)
          report['registry_tools']=len(registry.names())
          report['kmco_catalog']='VALIDATED_EXISTING_SNAPSHOT'
          report['adapter_import']='PASS'
          target=home/'KnowingMind/state/installations/cloudflare-adapter.json'
          target.write_text(json.dumps(report,indent=2)+'\n')
          out=Path(os.environ['RUNNER_TEMP'])/'kmcp-cloudflare-adapter.json'
          out.write_text(target.read_text())
          print(json.dumps(report,indent=2))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kmcp-live-provider-${{ github.run_id }}
          path: ${{ runner.temp }}/kmcp-cloudflare-adapter.json
          if-no-files-found: warn
          retention-days: 14
