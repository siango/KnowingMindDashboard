<!doctype html><html lang="th"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Dhamma-Tri Offline (2558–2567)</title>
<style>
 body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:14px;background:#fafafa;color:#222}
 header{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap}
 .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
 .btn,select{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
 .wrap{display:grid;gap:10px}
 .card{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}
 .q{border:1px solid #eee;border-radius:12px;padding:12px;background:#fff}
 .q h3{margin:0 0 6px 0;font-size:16px}
 .meta{font-size:12px;color:#666;margin-bottom:6px}
 .opt{margin:6px 0;display:block}
 textarea{width:100%;min-height:110px;border:1px solid #ddd;border-radius:10px;padding:10px;font-family:inherit}
 .toolbar{position:sticky;bottom:12px;display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
 .score{font-weight:600}
 .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eef;color:#225}
 .hint{color:#666;font-size:12px}
 .tag{display:inline-block;background:#ffe7a1;border:1px solid #ffd24d;color:#6a4b00;border-radius:999px;padding:2px 8px;margin-left:6px}
</style></head><body>
<header>
  <div class="row">
    <strong>นักธรรมชั้นตรี (ออฟไลน์)</strong> <span class="pill">OFFLINE</span>
    <span class="hint">ปี 2558–2567 · หมวด 1–3 ปรนัย · หมวด 4 อัตนัย</span>
  </div>
  <div class="row">
    <label>ปี: <select id="selYear"></select></label>
    <label>หมวด: <select id="selSec"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4 (อัตนัย)</option></select></label>
    <button class="btn" id="btnReload">โหลดจาก bundle</button>
  </div>
</header>

<div class="wrap">
  <div class="card"><div class="meta">แหล่งข้อมูล: <code>data/dhamma_tri_2558_2567.json</code> <span id="stat"></span></div></div>
  <div id="list"></div>
</div>

<div class="toolbar">
  <span class="score" id="score">คะแนน: 0/0</span>
  <button class="btn" id="btnSum">สรุปคะแนน</button>
  <button class="btn" id="btnSave">บันทึก</button>
  <button class="btn" id="btnExport">ส่งออก (.json)</button>
  <input type="file" id="imp" style="display:none" accept=".json"/><button class="btn" id="btnImport">นำเข้า</button>
  <button class="btn" id="btnClear">ล้างคำตอบ</button>
</div>

<script>
(function(){
  const KEY='dhamma_tri_answers_v3';
  const BUNDLE='data/dhamma_tri_2558_2567.json';
  let DB=null, year=2567, sec=1, ANS={};

  const ySel = document.getElementById('selYear');
  for(let y=2558;y<=2567;y++){ const o=document.createElement('option'); o.value=y; o.textContent=y; ySel.appendChild(o); }
  ySel.value=year; ySel.onchange=()=>{year=+ySel.value; render();};
  const sSel = document.getElementById('selSec'); sSel.value=sec; sSel.onchange=()=>{sec=+sSel.value; render();};

  function lsLoad(){ try{ANS=JSON.parse(localStorage.getItem(KEY)||'{}').answers||{};}catch(e){} }
  function lsSave(){ localStorage.setItem(KEY, JSON.stringify({answers:ANS, ts:Date.now()})); }
  function setA(id,v){ ANS[id]=v; lsSave(); }

  async function loadBundle(){
    const res = await fetch(BUNDLE+'?v='+Date.now()); DB = await res.json();
    document.getElementById('stat').textContent = DB.meta?.title || '';
  }

  function render(){
    const root=document.getElementById('list'); root.innerHTML='';
    const y = DB?.sets?.[year]; if(!y){ root.innerHTML='<div class="card">ปีนี้ยังไม่มี</div>'; return; }
    const secObj = y?.[sec]; if(!secObj){ root.innerHTML='<div class="card">หมวดนี้ยังไม่มี</div>'; return; }

    const header=document.createElement('div'); header.className='card';
    header.innerHTML = 'ปี '+year+' · หมวด '+sec+' · '+(secObj.type==='essay'?'อัตนัย':'ปรนัย') + (secObj.status && secObj.status!=='ready' ? <span class="tag"></span>:'');
    root.appendChild(header);

    let correct=0,total=0;
    (secObj.questions||[]).forEach((q,i)=>{
      total++; const qid = ${year}__;
      const div=document.createElement('div'); div.className='q';
      const h=document.createElement('h3'); h.textContent=ข้อ . ; div.appendChild(h);

      if(secObj.type==='essay'){
        const ta=document.createElement('textarea'); ta.placeholder=q.placeholder||'พิมพ์คำตอบที่นี่...';
        ta.value=ANS[qid]||''; ta.oninput=()=>setA(qid,ta.value); div.appendChild(ta);
        if(q.guideline){ const hint=document.createElement('div'); hint.className='hint'; hint.textContent='แนวตอบ: '+(Array.isArray(q.guideline)?q.guideline.join(' / '):q.guideline); div.appendChild(hint); }
      }else{
        const box=document.createElement('div');
        (q.options||[]).forEach((opt,idx)=>{
          const lb=document.createElement('label'); lb.className='opt';
          const ip=document.createElement('input'); ip.type='radio'; ip.name=qid; ip.value=idx;
          ip.checked=(String(ANS[qid])===String(idx)); ip.onchange=()=>setA(qid,Number(idx));
          lb.appendChild(ip); lb.appendChild(document.createTextNode(' '+opt)); box.appendChild(lb);
        });
        div.appendChild(box);
        if(typeof q.answer==='number' && String(ANS[qid])===String(q.answer)) correct++;
      }
      root.appendChild(div);
    });
    document.getElementById('score').textContent = คะแนน: /;
  }

  document.getElementById('btnReload').onclick=()=>{ loadBundle().then(render); };
  document.getElementById('btnSum').onclick=()=>alert(document.getElementById('score').textContent);
  document.getElementById('btnSave').onclick=lsSave;
  document.getElementById('btnExport').onclick=()=>{ const blob=new Blob([JSON.stringify({ts:new Date().toISOString(), answers:ANS, year, sec},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dhamma_tri_answers_'+Date.now()+'.json'; a.click(); URL.revokeObjectURL(a.href); };
  document.getElementById('btnImport').onclick=()=>document.getElementById('imp').click();
  document.getElementById('imp').addEventListener('change', function(){ const f=this.files?.[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const o=JSON.parse(r.result); if(o.answers){ ANS=o.answers; lsSave(); render(); alert('นำเข้าคำตอบสำเร็จ'); } else alert('ไฟล์ไม่ถูกต้อง'); }catch(e){ alert('อ่านไฟล์ไม่สำเร็จ'); } }; r.readAsText(f); this.value=''; });
  document.getElementById('btnClear').onclick=()=>{ if(confirm('ล้างคำตอบทั้งหมด?')){ ANS={}; lsSave(); render(); } };

  lsLoad(); loadBundle().then(render);
})();
</script></body></html>
