[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowingmind-kmcp"
version = "0.1.0"
description = "Portable MCP tool circuits on the existing KnowingMind Coding Worker"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kmcp = "coding_worker_v2.agent.circuit_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["coding_worker_v2", "coding_worker_v2.agent"]

[tool.setuptools.package-data]
coding_worker_v2 = ["pilot/*.md", "pilot/*.json", "agent/n8n/*.json"]
